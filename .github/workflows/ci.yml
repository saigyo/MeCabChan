name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Cache MeCab
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/mecab
          key: mecab-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-mecab.sh') }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild test \
            -project MeCabChan.xcodeproj \
            -scheme MeCabChan \
            -configuration Debug \
            -derivedDataPath build/dd

      - name: Build Release
        run: |
          xcodebuild build \
            -project MeCabChan.xcodeproj \
            -scheme MeCabChan \
            -configuration Release \
            -derivedDataPath build/dd
