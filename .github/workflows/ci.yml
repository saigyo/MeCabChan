name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache MeCab
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/mecab
          key: mecab-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-mecab.sh') }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild test \
            -project MeCabChan.xcodeproj \
            -scheme MeCabChan \
            -configuration Debug \
            -derivedDataPath build/dd

      - name: Build Release
        run: |
          xcodebuild build \
            -project MeCabChan.xcodeproj \
            -scheme MeCabChan \
            -configuration Release \
            -derivedDataPath build/dd
